<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>approach test</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
<link rel="stylesheet" href="css/game.css">
<style>
  #label { position: fixed; left: 12px; top: 10px; z-index: 5; font-size: 16px; color: #2b2418; background: rgba(255,248,231,.88); padding: 6px 12px; border-radius: 10px; line-height: 1.35; max-width: 70vw; }
  #label small { display: block; font-size: 12px; color: #7a6a50; }
</style>
</head>
<body>
<div id="label"></div>
<div id="toast" class="hidden"></div>
<div id="ask" class="screen hidden"><div class="card"><h2 id="askTitle"></h2><div id="askBody"></div><div class="choices" id="askChoices"></div></div></div>
<script type="module">
// ?who=trump|bezos|musk  ?x=<player x>  ?gate=1 (friends freed, past the gate line: the card shows)  ?free=1 (friends pre-freed, following)
// ?open=1 (door opening)  ?t=<seconds pre-rolled>  ?cam=chase|side|high|front|follow|gate|road  ?answer=right|wrong (click the card for you)
// Keys: arrows/WASD move (camera-relative like the game), Shift = run, Space = act (free a friend).
import * as THREE from 'three';
import { loadHamster, gerbilFrom, spawnBurst, updateBursts, textSprite } from './js/parts.js';
import { animateGerbil } from './js/props.js';
import { loadBosses2, makeBoss2 } from './js/bosses2.js';
import { makeBoss } from './js/bosses.js';
import { createApproach } from './js/approach.js';

const q = new URLSearchParams(location.search); const who = q.get('who') || 'trump'; const cam = q.get('cam') || 'chase'; const preroll = parseFloat(q.get('t') || '0');
const STOP_X = 100; const data = await (await fetch('data/billionaires.json')).json(); const b = data.bosses.find(x => x.id === who) || data.bosses[0];
const stop = { id: b.id, boss: b, sets: Math.round(b.net_worth_usd / 20), x: STOP_X, z: 80, size: 40 };
await loadHamster(); const ok = await loadBosses2(); console.log('bosses2', ok);

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa8dcf7); scene.fog = new THREE.Fog(0xcfe3f2, 60, 160);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x8a9a6a, .9));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(-8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0006; sun.shadow.normalBias = .03; const S = 22; sun.shadow.camera.left = sun.shadow.camera.bottom = -S; sun.shadow.camera.right = sun.shadow.camera.top = S; sun.shadow.camera.far = 80; scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 200), new THREE.MeshStandardMaterial({ color: 0x8fb06a, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.x = STOP_X - 40; ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(600, 4.4), new THREE.MeshStandardMaterial({ color: 0xd8c39a, roughness: 1 })); road.rotation.x = -Math.PI / 2; road.position.set(STOP_X - 40, .02, 0); road.receiveShadow = true; scene.add(road);
// the arena's pile marker, so the walk-through has somewhere to go
const pileMark = textSprite(['his pile (beat 3)'], { scale: 1 }); pileMark.position.set(STOP_X - 9, 1.6, 0); scene.add(pileMark);

const player = gerbilFrom({ color: 0xd9b07a }); scene.add(player); let heading = Math.PI / 2, camYaw = Math.PI / 2;
const state = { eggs: {}, tricksSeen: {}, friends: {} }; const save = () => {}; let asking = false;
const $ = id => document.getElementById(id);
function card(title, bodyHTML, choices) { asking = true; $('askTitle').textContent = title; $('askBody').innerHTML = bodyHTML; const box = $('askChoices'); box.innerHTML = ''; for (const c of choices) { const bt = document.createElement('button'); bt.innerHTML = c.label; if (c.go) bt.classList.add('go'); bt.onclick = () => c.on(bt); box.appendChild(bt); } $('ask').classList.remove('hidden'); }
function closeCard() { $('ask').classList.add('hidden'); asking = false; }
let toastT = null; function toast(text, { sub = '', ms = 2600 } = {}) { const t = $('toast'); t.innerHTML = text + (sub ? `<small>${sub}</small>` : ''); t.classList.remove('hidden'); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); console.log('toast:', text, sub); }
const sfx = { play: n => console.log('sfx', n) }; const play = (id, text) => console.log('play', id, text || ''); const say = t => console.log('say', t);
const makeBossFn = id => ok ? makeBoss2(id, { scale: 1.15 }) : makeBoss(id, { scale: 1.2 });

const ap = createApproach({ scene, player, gerbilFrom, spawnBurst, textSprite, makeBoss: makeBossFn, card, closeCard, toast, play, sfx, say, state, save });
const events = []; ap.start(stop, { onGate: () => { events.push('onGate'); console.log('onGate'); }, onOpen: () => { events.push('onOpen'); console.log('onOpen'); } });
player.position.set(parseFloat(q.get('x') ?? String(STOP_X - 60)), 0, 0); player.rotation.y = heading;
// ?gate=1: friends freed and just past the gate line (gateX - 4.8): the card shows
if (q.get('gate')) player.position.set(STOP_X - 14 - 4.6, 0, 0);
if (q.get('free') || q.get('gate')) ap.debugFree();

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .15, 400); const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const keys = new Set(); addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') { e.preventDefault(); if (!asking) console.log('act ->', ap.act()); } }); addEventListener('keyup', e => keys.delete(e.code));
let answered = false;
function step(dt, now) {
  if (!asking) {
    const cf = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw)), cr = new THREE.Vector3(-cf.z, 0, cf.x);
    const kx = (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0), kz = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
    let sp = 0; if (kx || kz) { const wantH = Math.atan2(cf.x * kx + cr.x * kz, cf.z * kx + cr.z * kz); let diff = Math.atan2(Math.sin(wantH - heading), Math.cos(wantH - heading)); heading += Math.sign(diff) * Math.min(Math.abs(diff), 3 * dt); sp = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 5 : 3; }
    player.position.x += Math.sin(heading) * sp * dt; player.position.z += Math.cos(heading) * sp * dt; player.rotation.y = heading;
    animateGerbil(player, { speed: sp, airborne: false, now, dt });
  }
  ap.update(dt, now); updateBursts(dt);
  if (asking && q.get('answer') && !answered) { answered = true; const want = q.get('answer'); const btns = [...$('askChoices').querySelectorAll('button')];   // try Trick! first, then True if that was wrong
    const first = btns.find(x => /Trick/.test(x.textContent)); first?.click(); if (first?.classList.contains('wrong') === (want === 'right')) btns.find(x => /True/.test(x.textContent))?.click(); if (want === 'right' && q.get('open')) { $('askChoices').querySelector('button.go')?.click(); } }
  if (q.get('open') && !q.get('answer') && ap.phase === 'gate' && asking) { closeCard(); ap.debugOpen(); }
  // camera
  let dy = Math.atan2(Math.sin(heading - camYaw), Math.cos(heading - camYaw)); camYaw += dy * Math.min(1, dt * 1.6);
  const cf = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw)); const p = player.position;
  if (cam === 'chase') { camPos.copy(p).addScaledVector(cf, -3.2).add(new THREE.Vector3(0, 1.9, 0)); camLook.copy(p).addScaledVector(cf, 2.5).add(new THREE.Vector3(0, .3, 0)); }
  else if (cam === 'side') { camPos.set(p.x + 1.5, 1.6, 5.5); camLook.set(p.x + 1, .3, 0); }
  else if (cam === 'high') { camPos.set(p.x - 10, 12, 14); camLook.set(p.x + 10, 0, 0); }
  else if (cam === 'road') { camPos.set(STOP_X - 64, 4, 3); camLook.set(STOP_X - 30, 1, 0); }
  else if (cam === 'follow') { camPos.set(p.x + 2.4, 1.1, 1.9); camLook.set(p.x - 1.2, .15, 0); }
  else if (cam === 'front') { camPos.set(p.x + 6, 1.4, 2.5); camLook.set(p.x, .4, 0); }
  else if (cam === 'gate') { camPos.set(STOP_X - 14 - 9, 2.6, 5); camLook.set(STOP_X - 14, 2.2, 0); }
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(p.x - 8, 14, 10); sun.target.position.set(p.x, 0, 0); sun.target.updateMatrixWorld();
}
if (preroll > 0) { let c = 0, now = 0; while (c < preroll) { step(1 / 60, now); c += 1 / 60; now += 1000 / 60; } }
let last = performance.now(); const label = document.getElementById('label');
function tick(now) { const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now; step(dt, now); renderer.render(scene, camera);
  label.innerHTML = `<b>${who}</b> · phase ${ap.phase} · x ${player.position.x.toFixed(1)} (gate at ${STOP_X - 14}) · ${ok ? 'bosses2' : 'bosses.js fallback'} · ${events.join(', ') || 'no events yet'}<small>?who=trump|bezos|musk &amp;x= &amp;gate=1 &amp;free=1 &amp;open=1 &amp;t=sec &amp;cam=chase|side|high|front|follow|gate|road · arrows move, Shift run, Space act</small>`;
  requestAnimationFrame(tick); }
requestAnimationFrame(tick);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
