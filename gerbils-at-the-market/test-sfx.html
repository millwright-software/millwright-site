  #panel { padding:14px; overflow:auto; border-right:3px solid #e2d4b2; }
  h2 { margin:10px 0 6px; font-size:18px; color:#7a6a50; font-weight:600; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; }
  button { font:inherit; font-size:15px; font-weight:600; padding:8px 6px; border-radius:12px; border:2px solid #e2d4b2; background:#fff; color:#2b2418; cursor:pointer; }
  button:hover { border-color:#3b8f4a; } button.on { background:#3b8f4a; color:#fff; border-color:#3b8f4a; }
  #stage { position:relative; } canvas { display:block; }
  #hud { position:absolute; top:12px; left:12px; background:rgba(255,248,231,.9); border:3px solid #e2d4b2; border-radius:14px; padding:8px 14px; font-size:22px; font-weight:700; }
  #log { font:12px/1.4 monospace; white-space:pre-wrap; color:#555; margin-top:10px; max-height:260px; overflow:auto; }

<div id="panel">

  <h2>Music</h2><div class="grid"><button id="m-market">market</button><button id="m-chase">chase</button><button id="m-stop">stop</button></div>
  <label><input type="range" id="mvol" min="0" max="1" step=".01" value=".25"> music volume</label>
  <label><input type="range" id="svol" min="0" max="1" step=".01" value=".6"> sfx volume</label>
  <div class="grid"><button id="duck">duck</button><button id="mute">mute</button><button id="audition">audition all</button></div>
  <h2>Juice</h2><div class="grid"><button id="j-shake">shake</button><button id="j-flash">flash</button><button id="j-pop">popText</button><button id="j-pulse">pulse HUD</button><button id="j-all">bonk combo</button><button id="export">export wavs</button></div>
  <div id="log"></div>
</div>
<div id="stage"><div id="hud">Cheeks ●○○</div></div>
<script type="module">
import * as THREE from 'three';
import { sfx, juice, SOUND_NAMES, TRACKS } from './js/sfx.js';
const $ = id => document.getElementById(id); const log = s => { $('log').textContent += s + '\n'; console.log(s); };
const q = new URLSearchParams(location.search);

// ---- the spinning cube: a stage for the shake (a 2D canvas stand-in when WebGL is unavailable, e.g. headless --disable-gpu) ----
const stage = $('stage'); let renderer = null, scene, camera, cube; const base = new THREE.Vector3(0, 1.2, 4.5);
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { log('no WebGL here; 2D stand-in cube'); }
const flat = renderer ? null : document.createElement('canvas'); stage.prepend(renderer ? renderer.domElement : flat);
if (renderer) {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xa8dcf7); camera = new THREE.PerspectiveCamera(50, 1, .1, 100);
  cube = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xd7262c, roughness: .6 })); scene.add(cube);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xd8c39a })); ground.rotation.x = -Math.PI / 2; ground.position.y = -.6; scene.add(ground);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x886644, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 5, 2); scene.add(sun);
}
function size() { const w = stage.clientWidth, h = stage.clientHeight; if (renderer) { renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); } else { flat.width = w; flat.height = h; } } size(); addEventListener('resize', size);
let last = performance.now(), spin = 0;
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; spin += dt; const off = juice.update(dt);
  if (renderer) { cube.rotation.y = spin; cube.rotation.x = spin * .4; camera.position.copy(base).add(off); camera.lookAt(0, 0, 0); renderer.render(scene, camera); }
  else { const g = flat.getContext('2d'); g.fillStyle = '#a8dcf7'; g.fillRect(0, 0, flat.width, flat.height); g.save(); g.translate(flat.width / 2 + off.x * 300, flat.height / 2 - off.y * 300); g.rotate(spin); g.fillStyle = '#d7262c'; g.fillRect(-60, -60, 120, 120); g.restore(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- audio starts on the first gesture ----
function arm() { if (sfx.ready) return; sfx.init(); $('status').textContent = sfx.ready ? `AudioContext ${sfx.context.state}, ${sfx.context.sampleRate} Hz` : 'No Web Audio in this browser'; }
addEventListener('pointerdown', arm, { capture: true }); addEventListener('keydown', arm, { capture: true });

for (const n of SOUND_NAMES) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { const len = sfx.play(n, n === 'whoosh' ? { speed: .8 } : {}); log(`${n}: ${len.toFixed(2)} s`); }; $('sounds').appendChild(b); }
for (let i = 0; i < 5; i++) { const b = document.createElement('button'); b.textContent = `deliver ${i}`; b.onclick = () => sfx.play('deliver', { step: i }); $('ladder').appendChild(b); }
const mbtn = { market: $('m-market'), chase: $('m-chase') }; const showMusic = () => { for (const k in mbtn) mbtn[k].classList.toggle('on', sfx.music.current === k); };
$('m-market').onclick = () => { sfx.music.start('market'); showMusic(); }; $('m-chase').onclick = () => { sfx.music.start('chase'); showMusic(); }; $('m-stop').onclick = () => { sfx.music.stop(); showMusic(); };
$('mvol').oninput = e => sfx.music.setVolume(+e.target.value); $('svol').oninput = e => sfx.setVolume(+e.target.value);
$('duck').onclick = e => { const on = !e.target.classList.contains('on'); e.target.classList.toggle('on', on); sfx.ducking(on); };
$('mute').onclick = e => { sfx.setMuted(!sfx.muted); e.target.classList.toggle('on', sfx.muted); };
$('audition').onclick = async () => { for (const n of SOUND_NAMES) { sfx.play(n, n === 'whoosh' ? { speed: .9 } : {}); juice.popText(n, stage.getBoundingClientRect().left + stage.clientWidth / 2, stage.clientHeight * .55, { color: '#2b2418' }); await new Promise(r => setTimeout(r, 800)); } };

$('j-shake').onclick = () => juice.shake(.6);
$('j-flash').onclick = () => juice.flash('#ffffff', 200);
$('j-pop').onclick = e => { const r = stage.getBoundingClientRect(); juice.popText('+1 bag', r.left + r.width * (.3 + Math.random() * .4), r.height * .5, { color: '#f2c230' }); };
$('j-pulse').onclick = () => { $('hud').textContent = `Cheeks ${'●'.repeat(1 + Math.floor(Math.random() * 3)).padEnd(3, '○')}`; juice.pulse($('hud')); };
$('j-all').onclick = () => { sfx.play('bonk'); juice.shake(.5); juice.flash('#ffd27a', 180); const r = stage.getBoundingClientRect(); juice.popText('BONK!', r.left + r.width / 2, r.height * .4, { color: '#ff6a3a', size: 40 }); juice.pulse($('hud')); };

// ---- export: render every sound and the first 4 bars of each loop offline; log duration/peak/rms; download wavs on request ----
// tools/render-sfx.mjs drives the same code over the DevTools protocol (window.__sfxExport / __sfxLive) and writes the wavs to disk.

  const str = s => { for (let i = 0; i < s.length; i++) out.setUint8(p++, s.charCodeAt(i)); }; const u32 = v => { out.setUint32(p, v, true); p += 4; }; const u16 = v => { out.setUint16(p, v, true); p += 2; };
  str('RIFF'); u32(36 + n * ch * 2); str('WAVE'); str('fmt '); u32(16); u16(1); u16(ch); u32(sr); u32(sr * ch * 2); u16(ch * 2); u16(16); str('data'); u32(n * ch * 2);

  return new Blob([out], { type: 'audio/wav' });
}
function stats(buf) { const d = buf.getChannelData(0); let peak = 0, sum = 0, lastIdx = 0; for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i] * d[i]; if (a > .002) lastIdx = i; } return { peak, rms: Math.sqrt(sum / d.length), tail: lastIdx / buf.sampleRate }; }
const exportItems = musicOnly => [...(musicOnly ? [] : SOUND_NAMES.map(n => [n, n === 'whoosh' ? { speed: .8 } : n === 'deliver' ? { step: 2 } : {}])), ...Object.keys(TRACKS).map(n => [n, {}])];

  const t0 = performance.now(); const buf = await sfx.render(name, opts); const s = stats(buf);
  log(`SFX ${name.padEnd(8)} sounds until ${s.tail.toFixed(2)} s  peak ${s.peak.toFixed(2)}  rms ${s.rms.toFixed(3)}${s.peak > .99 ? '  CLIP' : ''}  (${buf.duration.toFixed(1)} s rendered in ${(performance.now() - t0) | 0} ms)`);

async function exportAll(download, musicOnly = false) {
  for (const [name, opts] of exportItems(musicOnly)) {
    try { const r = await renderOne(name, opts); if (download) { const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = `sfx-${name}.wav`; a.click(); await new Promise(res => setTimeout(res, 150)); URL.revokeObjectURL(a.href); } }
    catch (e) { log(`SFX ${name} FAILED ${e.message}`); console.error(e); }
  }
  log('SFX export done');
}
$('export').onclick = () => exportAll(true);
if (q.get('export')) exportAll(q.get('export') === 'download', q.get('export') === 'music');
// hooks for tools/render-sfx.mjs
const b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
window.__sfxExport = async () => { const out = []; for (const [name, opts] of exportItems(false)) { const r = await renderOne(name, opts); out.push({ name, tail: r.tail, peak: r.peak, rms: r.rms, duration: r.buf.duration, wav: await b64(r.blob) }); } return out; };
window.__sfxLive = () => new Promise(res => { const lines = []; const L = s => { lines.push(s); log(s); };
  arm(); L(`LIVE ready=${sfx.ready} state=${sfx.context?.state}`); sfx.music.start('market'); sfx.play('bonk'); sfx.ducking(true); sfx.play('whoosh', { speed: 1 }); sfx.play('nope');
  setTimeout(() => { sfx.music.start('chase'); sfx.ducking(false); sfx.play('deliver', { step: 4, pan: .5, rate: 1.2 }); L(`LIVE crossfade to ${sfx.music.current}`); }, 1500);
  setTimeout(() => { sfx.music.stop(); sfx.setMuted(true); sfx.play('win'); L(`LIVE stopped, muted=${sfx.muted}, current=${sfx.music.current}`); sfx.setMuted(false); res(lines); }, 3200); });
// ?auto=1 with --autoplay-policy=no-user-gesture-required: the same live run from the URL
if (q.get('auto')) window.__sfxLive();
</script>
