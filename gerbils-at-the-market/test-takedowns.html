<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>takedowns test</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcf7; font-family: Fredoka, "Arial Rounded MT Bold", sans-serif; }
  canvas { display: block; }
  #label { position: fixed; left: 12px; top: 10px; font-size: 18px; color: #2b2418; background: rgba(255,248,231,.88); padding: 6px 12px; border-radius: 10px; line-height: 1.35; }
  #label small { display: block; font-size: 13px; color: #7a6a50; }
  #toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: rgba(43,36,24,.82); color: #fff8e7; font-size: 26px; font-weight: 600; padding: 12px 26px; border-radius: 30px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="label"></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import { loadBosses, makeBoss } from './js/bosses.js';
import { spawnBurst, updateBursts, textSprite } from './js/parts.js';
import { createTakedown } from './js/takedowns.js';

// ?who=trump|bezos|musk  ?t=<seconds to pre-roll>  ?scale=<boss scale, 1.2 in the game>  ?facing=<yaw>
const q = new URLSearchParams(location.search); const who = q.get('who') || 'trump'; const preroll = parseFloat(q.get('t') || '0'); const scale = parseFloat(q.get('scale') || '1.2'); const facing = parseFloat(q.get('facing') || '0');
await loadBosses();

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa8dcf7); scene.fog = new THREE.Fog(0xa8dcf7, 60, 160);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x8a9a6a, 1.0));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(-8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005; sun.shadow.normalBias = .02; sun.shadow.camera.left = sun.shadow.camera.bottom = -16; sun.shadow.camera.right = sun.shadow.camera.top = 16; sun.shadow.camera.far = 60; scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xcfe3ff, .5); fill.position.set(6, 4, -4); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x8cbf5a, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// the empty pile: the plaza disc the fight draws under the bags
const origin = new THREE.Vector3(0, 0, 0);
const plaza = new THREE.Mesh(new THREE.CircleGeometry(4.5, 40), new THREE.MeshStandardMaterial({ color: 0xd8c39a, roughness: 1 })); plaza.rotation.x = -Math.PI / 2; plaza.position.set(origin.x, .015, origin.z); plaza.receiveShadow = true; scene.add(plaza);
// a ring of simple trees behind, so "over the trees" reads
const trunkM = new THREE.MeshStandardMaterial({ color: 0x7a4f2a }), crownM = new THREE.MeshStandardMaterial({ color: 0x4e9a3c, roughness: .9 });
for (let i = 0; i < 26; i++) { const a = Math.PI * .55 + i / 26 * Math.PI * 1.3; const r = 14 + (i % 3) * 3; const k = 1.2 + (i % 4) * .5; const t = new THREE.Mesh(new THREE.CylinderGeometry(.15 * k, .22 * k, 1.8 * k, 7), trunkM); t.position.set(Math.cos(a) * r, .9 * k, Math.sin(a) * r - 2); t.castShadow = true; scene.add(t); const c = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3 * k, 1), crownM); c.position.set(t.position.x, 2.4 * k, t.position.z); c.castShadow = true; scene.add(c); }

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .05, 400);
const toastEl = document.getElementById('toast'); let toastT = null;
const toast = (text, { ms = 2600 } = {}) => { console.log("toast", text); toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms); };
let shake = 0; const td = createTakedown({ scene, spawnBurst, textSprite, toast, onShake: a => { shake = a; }, play: (id, text) => { if (text) console.log('say', id, text); } });

const boss = makeBoss(who, { scale }); boss.position.set(origin.x - 1.5, 0, origin.z + 1.2); scene.add(boss); boss.userData.boss.play('idle');
let gap = 0; const begin = () => td.start(who, boss, origin, { facing, onDone: () => { gap = 1.2; } });
begin();
const label = document.getElementById('label');
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(); const ct = td.cameraTarget(); camPos.copy(ct.pos); camera.position.copy(ct.pos); camLook.copy(ct.look);
function step(dt) {
  if (td.active) td.update(dt); else { boss.userData.boss.update(dt); if (gap > 0) { gap -= dt; if (gap <= 0) begin(); } }
  updateBursts(dt);
  const c = td.cameraTarget(); camPos.lerp(c.pos, 1 - Math.exp(-dt * 4)); camLook.lerp(c.look, 1 - Math.exp(-dt * 5));
  camera.position.copy(camPos); camera.lookAt(camLook); if (shake > 0) { camera.position.x += (Math.random() - .5) * .14 * shake; camera.position.y += (Math.random() - .5) * .14 * shake; }
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now; step(dt);
  label.innerHTML = `<b>${who}</b> · ${td.phase} · t=${td.t.toFixed(1)}s<small>?who=trump|bezos|musk &amp;t=sec &amp;scale=1.2</small>`;
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
if (preroll > 0) { for (let t = 0; t < preroll; t += 1 / 60) step(1 / 60); }
requestAnimationFrame(tick);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
