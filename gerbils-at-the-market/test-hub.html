<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub test — Gerbil Valley Market</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
<link rel="stylesheet" href="css/game.css">
<style>
  #label { position: fixed; left: 12px; top: 10px; font-size: 20px; color: #2b2418; background: rgba(255,248,231,.85); padding: 6px 12px; border-radius: 10px; z-index: 5; }
  #label small { display: block; font-size: 13px; color: #7a6a50; }
  #prompt { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #fff; background: rgba(43,36,24,.8); padding: 8px 18px; border-radius: 999px; z-index: 5; }
  #ctl { position: fixed; left: 12px; bottom: 12px; background: rgba(255,248,231,.85); padding: 8px 12px; border-radius: 10px; font-size: 15px; color: #2b2418; display: flex; gap: 10px; align-items: center; z-index: 5; }
  #hud { display: none; }
</style>
</head>
<body>
<div id="label"></div>
<div id="prompt" class="hidden"></div>
<div id="ctl"><span>arrows move · Space = act</span>
  <select id="cam"><option>square</option><option>sign</option><option>school</option><option>lookout</option><option>high</option><option>follow</option><option>street</option><option>west</option></select>
  <label>beaten <select id="beaten"><option>0</option><option>1</option><option>2</option><option>3</option></select></label></div>
<div id="hud"><div id="toast" class="hidden"></div></div>
<div id="ask" class="screen hidden">
  <div class="card">
    <h2 id="askTitle"></h2>
    <div id="askBody"></div>
    <div class="choices" id="askChoices"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { loadHamster, gerbilFrom, spawnBurst, updateBursts, textSprite } from './js/parts.js';
import * as P from './js/props.js';
import { createCity } from './js/city.js';
import { createHub } from './js/hub.js';
import { sfx } from './js/sfx.js';

const $ = id => document.getElementById(id); const q = new URLSearchParams(location.search);
let cam = q.get('cam') || 'square'; const nBeaten = +(q.get('beaten') || 0);
try { await document.fonts.load('700 40px Fredoka'); } catch (e) { console.warn('font', e); }
const hamsterReady = loadHamster(); await hamsterReady;
const data = await (await fetch('data/billionaires.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.info.autoReset = false; document.body.prepend(renderer.domElement);
P.setArtMode?.(q.get('art') === 'paper' ? 'paper' : 'old'); try { await P.preloadArt?.(renderer); } catch (e) { console.warn('preloadArt', e); } if (P.artMode?.() === 'paper') renderer.toneMapping = THREE.NeutralToneMapping;   // ?art=paper: the round-3 look
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa8dcf7); scene.environment = P.makeEnvironment(renderer); scene.environmentIntensity = .45; scene.fog = new THREE.Fog(0xcfe3f2, 90, 220);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a8a3a, .9));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(-18, 30, -10); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; sun.target.position.set(0, 0, 0);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45; sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40; sun.shadow.camera.near = 1; sun.shadow.camera.far = 110; scene.add(sun, sun.target);
// flat ground and the sand road along +x (what env.js draws in the game)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x9fbb78, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 3.2), new THREE.MeshStandardMaterial({ color: 0xd8c39a, roughness: 1 })); road.rotation.x = -Math.PI / 2; road.position.set(140, .025, 0); road.receiveShadow = true; scene.add(road);

// ---------- the game's shell: card, toast, state ----------
let asking = false;
function card(title, bodyHTML, choices) { asking = true; $('askTitle').textContent = title; $('askBody').innerHTML = bodyHTML; const box = $('askChoices'); box.innerHTML = ''; for (const c of choices) { const b = document.createElement('button'); b.innerHTML = c.label; if (c.go) b.classList.add('go'); b.onclick = () => c.on(b); box.appendChild(b); } $('ask').classList.remove('hidden'); }
function closeCard() { $('ask').classList.add('hidden'); asking = false; }
let toastT = null; function toast(text, { sub = '', ms = 2600 } = {}) { const t = $('toast'); $('hud').style.display = 'block'; t.innerHTML = text + (sub ? `<small>${sub}</small>` : ''); t.classList.remove('hidden'); requestAnimationFrame(() => t.classList.add('show')); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); console.log('[toast]', text, sub); }
const state = { player: 'alex', beaten: {}, eggs: {}, returned: 0 }; data.bosses.slice(0, nBeaten).forEach(b => { state.beaten[b.id] = { bags: 15 }; }); state.returned = nBeaten * 15 * 21700000;
const save = () => {};

// ---------- the player ----------
const player = gerbilFrom({ color: 0xd9b07a }); P.dressGerbil(player, { color: 0xd9b07a }); scene.add(player); let heading = Math.PI / 2;
const city = createCity({ scene, hamsterReady: true, gerbilFrom, spawnBurst, sfx });
const hub = createHub({ scene, player, state, save, gerbilFrom, spawnBurst, textSprite, card, closeCard, toast, play: () => {}, sfx, data, city,
  savePicture: () => { toast('Click! Picture saved.', { sub: 'savePicture() was called' }); }, onPick: id => toast(`onPick(${id})`, { sub: 'the game would start that level' }) });
hub.build(); hub.enter(); heading = player.rotation.y;
await new Promise(r => setTimeout(r, 0));   // the city's townsfolk are created once hamsterReady settles
// pre-roll: step the town deterministically before the first frame so the street has popped and the square is mid-life
const PRE = +(q.get('t') || 6); const t0 = performance.now(); let simT = 0; for (let k = 0; k < Math.round(PRE * 60); k++) { hub.update(1 / 60, t0 + simT * 1000); updateBursts(1 / 60); simT += 1 / 60; }

// ---------- cameras ----------
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .05, 600); scene.add(camera);
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), cf = new THREE.Vector3(); let camYaw = heading;
const CAMS = {
  square: [[15, 6, -3.5], [-1, .6, 3]],
  west: [[-14, 5, 9], [2, .8, 0]],
  street: [[-2, 2.2, -4], [0, 1, 12]],
  sign: [[22, 2.6, 0], [30, 3, 0]],   // the arch across the road at x 30
  school: [[4, 3.2, -3.5], [7, 2.6, -14]],
  lookout: [[-12, 5, -8], [-25, 1.6, -18]],
  high: [[-30, 34, 30], [4, 0, -2]],
};
function setCam(name) { cam = name; const c = CAMS[name]; if (c) { camera.position.set(...c[0]); camera.lookAt(...c[1]); } else if (name === 'follow') { camYaw = heading; cf.set(Math.sin(camYaw), 0, Math.cos(camYaw)); camera.position.copy(player.position).addScaledVector(cf, -3.2).add(new THREE.Vector3(0, 1.9, 0)); camera.lookAt(camLook.copy(player.position).addScaledVector(cf, 2.5).add(new THREE.Vector3(0, .3, 0))); } }
setCam(cam); $('cam').value = cam; $('cam').onchange = () => setCam($('cam').value); $('beaten').value = String(nBeaten); $('beaten').onchange = () => { location.search = `?beaten=${$('beaten').value}&cam=${cam}`; };
// ?at=sign|school|bell|lookout puts the player at that interactable; ?open=1 then presses act
const AT = { sign: [26.5, -1.3], school: [6, -11.2], bell: [9.6, -11.8], lookout: [-25, -18] }; const at = AT[q.get('at')]; if (at) { player.position.set(at[0], 0, at[1]); player.rotation.y = q.get('at') === 'sign' ? Math.PI : 0; heading = player.rotation.y; if (cam === 'follow') setCam('follow'); }

// ---------- input ----------
const keys = new Set(); addEventListener('keydown', e => { sfx.init(); if (e.repeat) return; keys.add(e.code); if (e.code === 'Space') { e.preventDefault(); if (!asking) hub.act(); } }); addEventListener('keyup', e => keys.delete(e.code));
addEventListener('pointerdown', () => sfx.init(), { once: true });

const tris = () => { let n = 0; scene.traverse(m => { if (m.isMesh && m.geometry && m.visible) { const g = m.geometry; const c = g.index ? g.index.count / 3 : g.attributes.position.count / 3; n += m.isInstancedMesh ? c * m.count : c; } }); return Math.round(n); };
let frames = 0; const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(.05, clock.getDelta()); simT += dt; const now = t0 + simT * 1000;
  if (!asking) { const kx = (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0), kz = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
    if (kx || kz) { heading = Math.atan2(kx, kz); const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 5 : 3;   // up = east (+x), right = +z
      player.position.x += Math.sin(heading) * speed * dt; player.position.z += Math.cos(heading) * speed * dt; player.rotation.y = heading; }
    P.animateGerbil(player, { speed: (kx || kz) ? 3 : 0, airborne: false, now, dt }); }
  hub.update(dt, now); updateBursts(dt);
  const pr = hub.prompt; if (pr) { $('prompt').textContent = pr; $('prompt').classList.remove('hidden'); } else $('prompt').classList.add('hidden');
  if (cam === 'follow') { let dy = Math.atan2(Math.sin(heading - camYaw), Math.cos(heading - camYaw)); camYaw += dy * Math.min(1, dt * 1.6); cf.set(Math.sin(camYaw), 0, Math.cos(camYaw)); camPos.copy(player.position).addScaledVector(cf, -3.2).add(new THREE.Vector3(0, 1.9, 0)); camLook.copy(player.position).addScaledVector(cf, 2.5).add(new THREE.Vector3(0, .3, 0)); camera.position.lerp(camPos, 1 - Math.exp(-dt * 6)); camera.lookAt(camLook); }
  renderer.info.reset(); renderer.render(scene, camera); frames++;
  if (frames === 2) { const i = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }; const sh = renderer.shadowMap.enabled; renderer.shadowMap.enabled = false; renderer.info.reset(); renderer.render(scene, camera); const base = renderer.info.render.calls;
    // the city alone, for the "beyond the city" count: hide the hub group and the player
    city.group.visible = false; player.visible = false; ground.visible = road.visible = false; renderer.info.reset(); renderer.render(scene, camera); const hubOnly = renderer.info.render.calls; renderer.shadowMap.enabled = sh; city.group.visible = true; player.visible = true; ground.visible = road.visible = true; const vis = (() => { let n = 0; hub.group.traverse(o => { if (o.isMesh && o.visible) n++; }); return n; })();
    $('label').innerHTML = `Gerbil Valley Market · ${nBeaten} beaten · street ${city.progress} homes <small>${base} draw calls (${i.calls} with shadows) · hub alone ${hubOnly} in view (${vis} hub meshes = its ceiling) · ${i.triangles.toLocaleString()} tris rendered · ${tris().toLocaleString()} in scene · cam ${cam}</small>`;
    console.log(`[hub] beaten ${nBeaten} calls ${base} (shadows ${i.calls}) hub-beyond-city ${hubOnly} hubMeshes ${vis} tris ${i.triangles} prompt ${hub.prompt}`);
    if (q.get('open')) { hub.update(0, now); console.log('[hub] act →', hub.act(), 'prompt', hub.prompt); } }
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__hub = hub; window.__city = city;
</script>
</body>
</html>
